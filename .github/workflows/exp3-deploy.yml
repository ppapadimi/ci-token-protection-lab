name: exp3-deploy
# Experiment 3: minimal Pages publisher modelled on the generic
# "push to default branch -> build -> deploy-pages" pattern.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site from the repository's web/ directory
        run: |
          mkdir -p site
          cp -r web/. site/
          printf '<!-- built from commit %s, event %s, at %s -->\n' \
            "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$(date -u +%FT%TZ)" >> site/index.html
          cat site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
