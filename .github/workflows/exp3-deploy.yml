name: exp3-deploy
# Experiment 3: minimal Pages publisher modelled on the generic
# "push to default branch -> build -> deploy-pages" pattern.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a one-page site that names the commit it came from
        run: |
          mkdir -p site
          {
            printf '<!doctype html><title>lab</title><h1>deploy marker</h1>\n'
            printf '<p>commit %s</p><p>event %s</p><p>built %s</p>\n' \
              "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$(date -u +%FT%TZ)"
          } > site/index.html
          cat site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
